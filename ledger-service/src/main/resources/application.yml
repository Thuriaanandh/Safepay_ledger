server:
  port: 8082

spring:
  application:
    name: ledger-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safepay_ledger}
    username: ${SPRING_DATASOURCE_USERNAME:safepay}
    password: ${SPRING_DATASOURCE_PASSWORD:safepay_secret}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}
    security:
      enabled: ${GRPC_SECURITY_ENABLED:true}
      certificate-chain: classpath:certs/ledger-service.crt
      private-key: classpath:certs/ledger-service.key
      trust-cert-collection: classpath:certs/ca.crt
      client-auth: REQUIRE # Enforce mutual TLS: client must present certificate signed by trusted CA

safepay:
  kafka:
    topics:
      transfer-events: transfer-events
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
    poll-interval-ms: 500
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
