# cert-manager PKI & Automated Certificate Management for SafePay Ledger
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: safepay-selfsigned-issuer
spec:
  selfSigned: {}
---
# 1. Root Certificate Authority
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: safepay-root-ca
  namespace: safepay
spec:
  isCA: true
  commonName: SafePay Root CA
  secretName: safepay-root-ca-secret
  duration: 43800h # 5 years
  issuerRef:
    name: safepay-selfsigned-issuer
    kind: ClusterIssuer
---
# 2. CA Issuer that mints leaf mTLS certificates for microservices
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: safepay-ca-issuer
spec:
  ca:
    secretName: safepay-root-ca-secret
---
# 3. Leaf Certificate for ledger-service (gRPC Server & mTLS)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ledger-service-cert
  namespace: safepay
spec:
  secretName: ledger-service-tls
  issuerRef:
    name: safepay-ca-issuer
    kind: ClusterIssuer
  commonName: ledger-service
  dnsNames:
    - ledger-service
    - ledger-service.safepay
    - ledger-service.safepay.svc
    - ledger-service.safepay.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages:
    - server auth
    - client auth
---
# 4. Leaf Certificate for payment-api (gRPC mTLS Client)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payment-api-cert
  namespace: safepay
spec:
  secretName: payment-api-tls
  issuerRef:
    name: safepay-ca-issuer
    kind: ClusterIssuer
  commonName: payment-api
  dnsNames:
    - payment-api
    - payment-api.safepay
    - payment-api.safepay.svc
    - payment-api.safepay.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages:
    - client auth
    - server auth
