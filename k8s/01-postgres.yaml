apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: safepay
type: Opaque
stringData:
  POSTGRES_DB: safepay_ledger
  POSTGRES_USER: safepay
  POSTGRES_PASSWORD: safepay_secret
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: safepay
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: safepay
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=64MB"
            - "-c"
            - "max_connections=30"
          envFrom:
            - secretRef:
                name: postgres-secret
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "safepay", "-d", "safepay_ledger"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "safepay", "-d", "safepay_ledger"]
            initialDelaySeconds: 5
            periodSeconds: 5
