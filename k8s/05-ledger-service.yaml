apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: safepay
  labels:
    app: ledger-service
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
    - port: 9091
      targetPort: 9091
      name: grpc
  selector:
    app: ledger-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: safepay
  labels:
    app: ledger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: ledger-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/safepay_ledger"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: GRPC_SERVER_PORT
              value: "9091"
            - name: GRPC_SECURITY_ENABLED
              value: "true"
            - name: GRPC_SECURITY_CERTIFICATE_CHAIN
              value: "file:/etc/certs/tls.crt"
            - name: GRPC_SECURITY_PRIVATE_KEY
              value: "file:/etc/certs/tls.key"
            - name: GRPC_SECURITY_TRUST_CERT_COLLECTION
              value: "file:/etc/certs/ca.crt"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9091
              name: grpc
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: certs
          secret:
            secretName: ledger-service-tls
            optional: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-service-pdb
  namespace: safepay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledger-service
